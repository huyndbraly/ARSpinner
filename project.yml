name: ARSpinner
options:
  bundleIdPrefix: com.arspinner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: TQUX3GK3BM

targets:
  ARSpinner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ARSpinner
    info:
      path: ARSpinner/Info.plist
      properties:
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "ARSpinner requires camera access to place and interact with 3D fidget spinners in your physical environment."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arspinner.ARSpinner
        PRODUCT_NAME: ARSpinner
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ARSpinnerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ARSpinnerTests
    dependencies:
      - target: ARSpinner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arspinner.ARSpinnerTests
        PRODUCT_NAME: ARSpinnerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ARSpinner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ARSpinner"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ARSpinner:
    build:
      targets:
        ARSpinner: all
        ARSpinnerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ARSpinnerTests
